<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        @font-face {
            font-family: 'Highland Perk';
            src: url("highlandperk.ttf") format("truetype");
        }
        html, body {
            margin: 0;
            background: #111;
        }
        .gallery-header {
            position: sticky;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem 3rem;
            background: rgba(17, 17, 17, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 10;
        }
        .gallery-header h1 {
            font-family: 'Highland Perk', cursive;
            font-size: 1.8rem;
            font-weight: 400;
            color: #f3ead9;
            margin: 0;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: sans-serif;
            font-weight: 300;
            font-size: 1rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-decoration: none;
            color: #f3ead9;
            border: 1px solid rgba(243, 234, 217, 0.4);
            border-radius: 4px;
            padding: 0.6rem 1.2rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .back-link:hover {
            background-color: #f3ead9;
            color: #111;
        }
        .masonry {
            column-count: 4;
            column-gap: 1rem;
            padding: 1.5rem 2rem 4rem;
        }
        .masonry img {
            display: block;
            width: 100%;
            height: auto;
            margin-bottom: 1rem;
            border-radius: 4px;
            break-inside: avoid;
            transition: transform 0.4s ease, filter 0.4s ease;
        }
        .masonry img:hover {
            transform: scale(1.02);
            filter: brightness(1.08);
        }
        @media (max-width: 1100px) {
            .masonry { column-count: 3; }
        }
        @media (max-width: 750px) {
            .masonry {
                column-count: 3;
                column-gap: 0.4rem;
                padding: 1rem 0.6rem 3rem;
            }
            .masonry img {
                margin-bottom: 0.4rem;
                border-radius: 2px;
            }
            .gallery-header { padding: 1.2rem 1.5rem; }
        }
    </style>
</head>
