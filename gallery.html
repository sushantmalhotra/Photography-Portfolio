<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <style>
        @font-face {
            font-family: 'Highland Perk';
            src: url("highlandperk.ttf") format("truetype");
        }
        html, body {
            margin: 0;
            background: #111;
        }
        .gallery-header {
            position: sticky;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem 3rem;
            background: rgba(17, 17, 17, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 10;
        }
        .gallery-header h1 {
            font-family: 'Highland Perk', cursive;
            font-size: 1.8rem;
            font-weight: 400;
            color: #f3ead9;
            margin: 0;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: sans-serif;
            font-weight: 300;
            font-size: 1rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-decoration: none;
            color: #f3ead9;
            border: 1px solid rgba(243, 234, 217, 0.4);
            border-radius: 4px;
            padding: 0.6rem 1.2rem;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .back-link:hover {
            background-color: #f3ead9;
            color: #111;
        }
        .masonry {
            column-count: 4;
            column-gap: 1rem;
            padding: 1.5rem 2rem 4rem;
        }
        .masonry-item {
            position: relative;
            break-inside: avoid;
            margin-bottom: 1rem;
            overflow: hidden;
            border-radius: 4px;
            cursor: pointer;
        }
        .masonry-item img {
            display: block;
            width: 100%;
            height: auto;
            margin-bottom: 0;
            border-radius: 4px;
            transition: transform 0.4s ease, filter 0.4s ease;
        }
        .masonry-item:hover img {
            transform: scale(1.04);
            filter: brightness(1.05);
        }
        .masonry-item .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 1rem;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0) 55%);
            opacity: 0;
            transition: opacity 0.35s ease;
            pointer-events: none;
        }
        .masonry-item:hover .overlay {
            opacity: 1;
        }
        .masonry-item .overlay .category {
            font-family: sans-serif;
            font-weight: 300;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #d9c9a3;
        }
        .masonry-item .overlay .title {
            font-family: 'Highland Perk', cursive;
            font-size: 1.4rem;
            color: #f3ead9;
            margin-top: 0.2rem;
        }
        @media (max-width: 1100px) {
            .masonry { column-count: 3; }
        }
        @media (max-width: 750px) {
            .masonry {
                column-count: 3;
                column-gap: 0.4rem;
                padding: 1rem 0.6rem 3rem;
            }
            .masonry-item {
                margin-bottom: 0.4rem;
                border-radius: 2px;
            }
            .masonry-item img {
                border-radius: 2px;
            }
            .masonry-item:hover .overlay {
                opacity: 0;
            }
            .masonry-item.active .overlay {
                opacity: 1;
            }
            .masonry-item .overlay {
                padding: 0.6rem;
            }
            .masonry-item .overlay .category {
                font-size: 0.6rem;
            }
            .masonry-item .overlay .title {
                font-size: 1rem;
            }
            .gallery-header { padding: 1.2rem 1.5rem; }
        }
    </style>
</head>

    <script>
        document.querySelectorAll('.masonry-item').forEach((item) => {
            const overlay = document.createElement('div');
            overlay.className = 'overlay';
            overlay.innerHTML = `
                <span class="category">${item.dataset.category}</span>
                <span class="title">${item.dataset.title}</span>
            `;
            item.appendChild(overlay);
        });

        const isMobile = window.matchMedia('(max-width: 750px)').matches;
        if (isMobile) {
            const items = document.querySelectorAll('.masonry-item');
            items.forEach((item) => {
                item.addEventListener('click', (e) => {
                    const alreadyActive = item.classList.contains('active');
                    items.forEach((other) => other.classList.remove('active'));
                    if (!alreadyActive) {
                        item.classList.add('active');
                    }
                    e.stopPropagation();
                });
            });
            document.addEventListener('click', () => {
                items.forEach((item) => item.classList.remove('active'));
            });
        }
    </script>
